    <!-- Terminal background -->
    <rect
        width="100%"
        height="100%"
        rx="10"
        fill="#0D1117"
    />

    <!-- Terminal border -->
    <rect
        x="0.5"
        y="0.5"
        width="635"
        height="673"
        rx="10"
        fill="none"
        stroke="#30363D"
    />

    <!-- Header divider -->
    <line
        x1="0"
        y1="38"
        x2="636"
        y2="38"
        stroke="#30363D"
    />

    <!-- Window controls -->
    <circle cx="16" cy="18" r="5" fill="#484F58"/>
    <circle cx="34" cy="18" r="5" fill="#484F58"/>
    <circle cx="52" cy="18" r="5" fill="#484F58"/>

    <!-- Terminal title -->
    <text
        x="318"
        y="22"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8B949E"
    >navneet@github ~</text>

    <!-- Command -->
    <text
        x="18"
        y="57"
        font-family="monospace"
        font-size="11"
        fill="#F0F6FC"
    >
        <tspan fill="#58A6FF">$</tspan>
        <tspan> whoami</tspan>
    </text>

